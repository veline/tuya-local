name: Taxnele Smart Breaker
products:
  - id: gvxvhlgqlm3bbzwt
entities:
  - entity: sensor
    name: Total Energy
    class: energy
    category: diagnostic
    icon: mdi:lightning-bolt
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        scale: 0.01

  - entity: sensor
    class: voltage
    category: diagnostic
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: V
        class: measurement
        mask: "FFFF000000000000"
        mapping:
          - scale: 10

  - entity: sensor
    class: current
    category: diagnostic
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000

  - entity: sensor
    class: power
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        unit: W
        class: measurement
        mask: "0000000000FFFFFF"

  - entity: sensor
    name: Balance Energy
    class: energy
    category: diagnostic
    icon: mdi:scale-balance
    dps:
      - id: 13
        type: integer
        name: sensor
        unit: kWh
        scale: 0.01

  - entity: sensor
    name: Energy Charge
    class: energy
    category: diagnostic
    icon: mdi:credit-card-flash
    dps:
      - id: 14
        type: integer
        name: sensor
        unit: kWh
        scale: 0.01

  - entity: sensor
    name: Leakage Current
    category: diagnostic
    icon: mdi:current-ac
    dps:
      - id: 15
        type: integer
        name: sensor
        unit: mA

  - entity: switch
    name: Breaker
    icon: mdi:circuit-breaker
    dps:
      - id: 16
        type: boolean
        name: switch
      - id: 101
        type: string
        name: relay_status
        mapping:
          - dps_val: "off"
              value: "off"
          - dps_val: "on"
              value: "on"
          - dps_val: "memory"
              value: "memory"

  - entity: sensor
    name: Temperature Zone 1
    class: temperature
    category: diagnostic
    icon: mdi:thermometer
    dps:
      - id: 25
        type: integer
        name: sensor
        unit: °C

  - entity: sensor
    name: Temperature Zone 3 / Current
    category: diagnostic
    icon: mdi:amperage
    dps:
      - id: 27
        type: integer
        name: sensor
        unit: A

  - entity: sensor
    name: Supply Frequency
    class: frequency
    category: diagnostic
    icon: mdi:sine-wave
    dps:
      - id: 32
        type: integer
        name: sensor
        unit: Hz
        scale: 0.1

  - entity: sensor
    name: Power Factor
    class: power_factor
    category: diagnostic
    icon: mdi:angle-acute
    dps:
      - id: 50
        type: integer
        name: sensor
        scale: 0.01

  - entity: binary_sensor
    name: Fault Status
    class: problem
    category: diagnostic
    icon: mdi:alert-octagon
    dps:
      - id: 9
        type: bitfield
        name: sensor

  - entity: switch
    name: Prepayment Switch
    category: config
    icon: mdi:cash-register
    dps:
      - id: 11
        type: boolean
        name: switch

  - entity: switch
    name: Clear Energy
    category: config
    icon: mdi:refresh
    dps:
      - id: 12
        type: boolean
        name: switch

  - entity: switch
    name: Child Lock
    category: config
    icon: mdi:lock
    dps:
      - id: 36
        type: boolean
        name: switch

  - entity: switch
    name: Auto Reclosing
    category: config
    icon: mdi:autorenew
    dps:
      - id: 49
        type: boolean
        name: switch

  - entity: number
    name: Countdown
    category: config
    icon: mdi:timer-sand
    dps:
      - id: 102
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 500

  - entity: number
    name: Recloser Delay
    category: config
    icon: mdi:clock-start
    dps:
      - id: 108
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 500

  - entity: select
    name: Max Residual Phase
    category: config
    icon: mdi:source-branch
    dps:
      - id: 44
        type: string
        name: select
        mapping:
          - dps_val: item_1
          - dps_val: item_2
          - dps_val: item_3
          - dps_val: none
