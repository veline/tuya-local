name: Taxnele Smart Breaker
products:
  - id: gvxvhlgqlm3bbzwt
    manufactorer: Taxnele
    model: TVPS1-63FW
entities:
  - entity: sensor
    name: Forward active energy
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100

  - entity: sensor
    class: voltage
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        unit: V
        class: measurement
        mask: "FFFF000000000000"
        mapping:
          - scale: 10

  - entity: sensor
    class: current
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000

  - entity: sensor
    class: power
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        optional: true
        unit: kW
        class: measurement
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 9
        type: bitfield
        name: fault_code

  - entity: switch
    name: Prepayment switch
    category: config
    icon: "mdi:cash-multiple"
    dps:
      - id: 11
        type: boolean
        name: switch

  - entity: button
    name: Clear balance
    category: config
    class: restart
    dps:
      - id: 12
        type: boolean
        name: button

  - entity: sensor
    name: Balance energy
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        unit: kWh
        class: measurement
        mapping:
          - scale: 100

  - entity: number
    name: Energy charge
    category: config
    icon: "mdi:cash"
    dps:
      - id: 14
        type: integer
        name: value
        optional: true
        unit: kWh
        range:
          min: 0
          max: 999999
        mapping:
          - scale: 100

  - entity: sensor
    translation_key: leakage_current
    class: current
    category: diagnostic
    dps:
      - id: 15
        type: integer
        name: sensor
        unit: mA
        class: measurement

  - entity: switch
    name: Circuit breaker
    icon: "mdi:fuse"
    category: config
    dps:
      - id: 16
        type: boolean
        name: switch

  - entity: button
    name: Leakage test
    icon: "mdi:current-ac"
    category: config
    dps:
      - id: 22
        type: boolean
        name: button
        optional: true

  - entity: sensor
    class: temperature
    category: diagnostic
    dps:
      - id: 25
        type: integer
        name: sensor
        unit: C
        class: measurement

  - entity: sensor
    name: Time-limited current
    category: diagnostic
    icon: "mdi:current-ac"
    dps:
      - id: 27
        type: integer
        name: sensor
        unit: A
        class: measurement

  - entity: sensor
    class: frequency
    category: diagnostic
    dps:
      - id: 32
        type: integer
        name: sensor
        unit: Hz
        class: measurement
        mapping:
          - scale: 10

  - entity: button
    translation_key: factory_reset
    category: config
    hidden: true
    dps:
      - id: 34
        type: boolean
        name: button
        optional: true

  - entity: button
    name: Refresh sensors
    class: restart
    category: config
    dps:
      - id: 35
        type: string
        name: button
        optional: true
        value: "online"

  - entity: switch
    name: Maintenance lock
    category: config
    icon: "mdi:lock"
    dps:
      - id: 36
        type: boolean
        name: switch

  - entity: switch
    name: Automatic closing switch
    category: config
    icon: "mdi:autorenew"
    dps:
      - id: 49
        type: boolean
        name: switch

  - entity: sensor
    class: power_factor
    category: diagnostic
    dps:
      - id: 50
        type: integer
        name: sensor
        unit: "%"
        class: measurement
        mapping:
          - scale: 100

  - entity: select
    name: Relay status
    category: config
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: "off"
            value: "off"
          - dps_val: "on"
            value: "on"
          - dps_val: "memory"
            value: memory

  - entity: number
    name: Countdowns
    category: config
    icon: "mdi:timer-sand"
    dps:
      - id: 102
        type: integer
        name: value
        optional: true
        unit: s
        range:
          min: 0
          max: 500

